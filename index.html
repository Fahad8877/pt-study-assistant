<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PT Study Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-home" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></symbol>
    <symbol id="i-quiz" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></symbol>
    <symbol id="i-case" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4.8 2.3A.3.3 0 1 0 5 2H4a2 2 0 0 0-2 2v5a6 6 0 0 0 6 6 6 6 0 0 0 6-6V4a2 2 0 0 0-2-2h-1a.2.2 0 1 0 .3.3"/><path d="M8 15v1a6 6 0 0 0 6 6 6 6 0 0 0 6-6v-4"/><circle cx="20" cy="10" r="2"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="14" y2="17"/></symbol>
    <symbol id="i-spark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></symbol>
    <symbol id="i-globe" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a14 14 0 0 1 0 18a14 14 0 0 1 0-18z"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></symbol>
    <symbol id="i-slides" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></symbol>
    <symbol id="i-anatomy" viewBox="0 0 200 320" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="100" cy="34" r="22"/><path d="M100 56v14"/><path d="M62 92c10-14 26-22 38-22s28 8 38 22l8 60c2 12-4 22-14 24H68c-10-2-16-12-14-24z"/><path d="M62 92l-24 56c-3 8 0 16 6 20l16 10"/><path d="M138 92l24 56c3 8 0 16-6 20l-16 10"/><path d="M76 178l-6 54 4 46c1 8 4 14 8 18"/><path d="M124 178l6 54-4 46c-1 8-4 14-8 18"/><path d="M100 78v96"/><path d="M78 118h44M80 134h40M82 150h36"/><path d="M60 178h80"/><path d="M82 296h20M98 296h20"/></symbol>
  </svg>

  <div class="app">
    <aside class="sidebar">
      <a href="#/" class="brand">
        <span class="brand-mark">PT</span>
        <span class="brand-text">
          <span class="brand-name" data-i18n="app.name">PT Study Assistant</span>
          <span class="brand-tagline" data-i18n="app.tagline">Learn · Understand · Apply</span>
        </span>
      </a>
      <nav class="nav" id="main-nav" aria-label="Main">
        <a href="#/" data-route="dashboard"><svg><use href="#i-home"/></svg><span data-i18n="nav.dashboard">Home</span></a>
        <a href="#/upload" data-route="upload"><svg><use href="#i-upload"/></svg><span data-i18n="nav.upload">Upload Lecture</span></a>
        <a href="#/lectures" data-route="lectures"><svg><use href="#i-book"/></svg><span data-i18n="nav.lectures">My Lectures</span></a>
        <a href="#/quiz" data-route="quiz"><svg><use href="#i-quiz"/></svg><span data-i18n="nav.quiz">Quiz</span></a>
        <a href="#/case" data-route="case"><svg><use href="#i-case"/></svg><span data-i18n="nav.case">Clinical Case</span></a>
        <a href="#/settings" data-route="settings"><svg><use href="#i-gear"/></svg><span data-i18n="nav.settings">AI Settings</span></a>
      </nav>
      <div class="sidebar-foot">
        <div class="lang-switch lang-switch-side" role="group" aria-label="Language">
          <svg class="globe" aria-hidden="true"><use href="#i-globe"/></svg>
          <button type="button" data-lang="en" class="active">EN</button>
          <button type="button" data-lang="ar">عربي</button>
        </div>
        <div class="foot-note" data-i18n="app.foot">Master of Physical Therapy</div>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <a href="#/" class="brand">
          <span class="brand-mark">PT</span>
          <span class="brand-text"><span class="brand-name" data-i18n="app.name">PT Study Assistant</span></span>
        </a>
        <div class="lang-switch" role="group" aria-label="Language">
          <button type="button" data-lang="en" class="active">EN</button>
          <button type="button" data-lang="ar">عربي</button>
        </div>
        <a href="#/settings" class="icon-btn topbar-settings" data-route="settings" aria-label="AI Settings"><svg><use href="#i-gear"/></svg></a>
      </header>

      <main id="view" class="view"></main>
    </div>
  </div>

  <nav class="bottom-nav" aria-label="Main">
    <a href="#/" data-route="dashboard"><svg><use href="#i-home"/></svg><span data-i18n="nav.short.dashboard">Home</span></a>
    <a href="#/upload" data-route="upload"><svg><use href="#i-upload"/></svg><span data-i18n="nav.short.upload">Upload</span></a>
    <a href="#/lectures" data-route="lectures"><svg><use href="#i-book"/></svg><span data-i18n="nav.short.lectures">Lectures</span></a>
    <a href="#/quiz" data-route="quiz"><svg><use href="#i-quiz"/></svg><span data-i18n="nav.short.quiz">Quiz</span></a>
    <a href="#/case" data-route="case"><svg><use href="#i-case"/></svg><span data-i18n="nav.short.case">Case</span></a>
  </nav>

  <div id="toast" class="toast" hidden></div>

  <!-- Third-party parsers (CDN) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

  <!-- App -->
  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/parsers.js"></script>
  <script src="js/sample-lecture.js"></script>
  <script src="js/ai/mock.js"></script>
  <script src="js/ai/api.js"></script>
  <script src="js/ai/browser.js"></script>
  <script src="js/ai/index.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
